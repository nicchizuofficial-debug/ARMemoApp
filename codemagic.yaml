workflows:
  # 署名なしのビルド検証ワークフロー。Apple Developer Programへの登録が
  # まだでも、push のたびにコンパイルが通るかどうかを確認できます。
  ios-build-check:
    name: "AR Memo - Build Check (No Signing)"
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_SCHEME: "ARMemoApp"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build for generic iOS device (no code signing)
        script: |
          xcodebuild build \
            -project ARMemoApp.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

  # TestFlight配信用の署名付きIPAビルド。
  # ARKitはシミュレータのカメラでは動作しないため、実機確認にはこちらが必要です。
  # Ad Hoc/Development配信は実機のUDID事前登録が必要で扱いが煩雑なため、
  # 他プロジェクト（kaudoki等）と同じくTestFlight経由（app_store配信）で
  # 実機にインストールする方式にしている。デバイス登録は不要。
  #
  # 署名は「手動」方式（Codemagicにアップロード済みの証明書・プロファイルを
  # 参照名で指定）を使う。「自動」方式（ios_signing.distribution_type +
  # bundle_identifier）はアカウント内の配布証明書の枚数上限に度々引っかかり
  # 安定しなかったため、事前に手動で作成・アップロードした証明書
  # （Reference name: armemoapp_distribution）とプロビジョニングプロファイル
  # （Reference name: armemoapp_appstore_profile）を明示的に使う。
  # アップロード場所: Codemagic > Personal Account settings > Code signing identities
  ios-device-build:
    name: "AR Memo - iOS TestFlight Build"
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        provisioning_profiles:
          - armemoapp_appstore_profile
        certificates:
          - armemoapp_distribution
      vars:
        XCODE_SCHEME: "ARMemoApp"
        BUNDLE_ID: "com.nicchizu.armemoapp"
        # App Store Connect上のApp ID（数値）。appstoreconnect.apple.com/apps/<この数字>/... のURLから確認。
        APP_STORE_APP_ID: "6801956816"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set next build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "ARMemoApp.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - nicchizu.official@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
