name: ARMemoApp
options:
  bundleIdPrefix: com.nicchizu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
targets:
  ARMemoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ARMemoApp
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "mARk"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "mARk uses the camera to place and display memos in real space."
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicchizu.armemoapp
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
